<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frizer Arsa — Admin prijava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#141416;--line:rgba(255,255,255,.1);--text:#fafaf8;--muted:#a7a7a7;--bronze:#b98a56;--cream:#f1e8d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(185,138,86,.13),transparent 30%),#0b0b0c;color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(470px,100%)}.brand{font:800 30px "Barlow Condensed";letter-spacing:.08em;text-align:center;margin-bottom:18px}.brand span{color:var(--bronze)}.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 28px 90px rgba(0,0,0,.46)}.kicker{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:9px}h1{font:800 56px/.92 "Barlow Condensed";margin:0 0 12px}.muted{color:var(--muted);font-size:14px;line-height:1.65}.field{margin-top:22px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9d9da1;margin-bottom:8px}.pw-wrap{position:relative}.pw-wrap input{width:100%;background:#0f0f11;border:1px solid var(--line);color:#fff;padding:15px 48px 15px 14px;border-radius:11px;outline:none}.pw-wrap input:focus{border-color:var(--bronze);box-shadow:0 0 0 3px rgba(185,138,86,.1)}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#aaa;cursor:pointer;padding:8px}.btn{width:100%;margin-top:14px;border:1px solid var(--bronze);background:var(--bronze);color:#111;padding:14px;border-radius:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.back{display:block;text-align:center;margin-top:16px;color:#8f8f93;font-size:13px;text-decoration:none}.back:hover{color:#fff}.msg{display:none;margin-top:13px;padding:11px 12px;border-radius:10px;font-size:12px}.msg.err{display:block;background:rgba(173,67,67,.12);border:1px solid rgba(173,67,67,.35);color:#efadad}.msg.ok{display:block;background:rgba(91,181,112,.11);border:1px solid rgba(91,181,112,.32);color:#9fe0ae}.lock{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(185,138,86,.12);border:1px solid rgba(185,138,86,.28);font-size:21px;margin-bottom:16px}@media(max-width:520px){.card{padding:24px 18px}h1{font-size:48px}}

/* ===== RESPONSIVE V2 — fluid screens, no horizontal overflow ===== */
html,body{width:100%;max-width:100%;overflow-x:clip!important}
*,*::before,*::after{box-sizing:border-box}
img,svg,video,canvas{max-width:100%;height:auto}
input,select,textarea,button{max-width:100%;min-width:0}
a,button{overflow-wrap:anywhere}
\n@media(max-width:560px){body{padding:12px!important}.shell,.card,.box{width:100%!important;max-width:100%!important}.card,.box{padding:20px 16px!important}h1{font-size:clamp(38px,13vw,52px)!important}.btn,button{width:100%!important}}
</style>

<style id="phone-final-v3">
/* PHONE FINAL V3 — strict fluid layout */
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
*,*::before,*::after{box-sizing:border-box}
img,video,svg,canvas,iframe{max-width:100%!important;height:auto}
main,section,header,footer,nav,article,aside,div,form,fieldset{min-width:0}
button,input,select,textarea,a{min-width:0;max-width:100%}
button,a{overflow-wrap:anywhere}
@media(max-width:780px){
  html{font-size:16px}
  body{width:100%;overflow-x:hidden!important}
  .wrap,.container,.shell,.inner,.content,.section-inner{width:calc(100% - 24px)!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important;padding-left:0!important;padding-right:0!important}
  h1{font-size:clamp(2.25rem,12vw,4rem)!important;line-height:.98!important;overflow-wrap:anywhere}
  h2{font-size:clamp(2rem,10vw,3.2rem)!important;line-height:1!important;overflow-wrap:anywhere}
  h3{font-size:clamp(1.35rem,6vw,2rem)!important}
  p{max-width:100%!important;overflow-wrap:anywhere}
  .actions,.hero-actions,.ctarow,.button-row,.btn-row,.buttons{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;width:100%!important}
  .actions .btn,.hero-actions .btn,.ctarow .btn,.button-row .btn,.btn-row .btn,.buttons .btn,.actions a,.hero-actions a,.ctarow a{width:100%!important;max-width:100%!important;justify-content:center!important;text-align:center!important;margin-left:0!important;margin-right:0!important}
  .modal,.overlay,.lightbox,.booking,.panel-overlay{max-width:100vw!important;overflow-x:hidden!important}
  .modal>* , .overlay>* , .booking>* , .lightbox>*{max-width:calc(100vw - 20px)!important}
  input,select,textarea{width:100%!important;font-size:16px!important}
  table{max-width:100%}
}
@media(max-width:420px){
  .wrap,.container,.shell,.inner,.content,.section-inner{width:calc(100% - 18px)!important}
  h1{font-size:clamp(2.05rem,13vw,3.35rem)!important}
  h2{font-size:clamp(1.8rem,10.5vw,2.65rem)!important}
}
</style>

<style id="phone-final-arsa">
@media(max-width:780px){
  .nav{height:70px!important}.brand{font-size:21px!important}.nav.open .navlinks{left:8px!important;right:8px!important;top:68px!important;max-width:calc(100vw - 16px)!important}
  .hero{min-height:auto!important;padding:108px 0 92px!important}.hero-content{width:100%!important;max-width:100%!important}.hero h1{width:100%!important;max-width:100%!important}.hero-copy{font-size:15px!important}
  .hero-actions{display:grid!important;grid-template-columns:1fr!important;width:100%!important}.hero-actions>*{width:100%!important}
  .trust{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important}.pill{text-align:center!important;white-space:normal!important}
  .section{padding:70px 0!important}.services,.extras,.why,.review-grid,.about-grid,.location-grid{grid-template-columns:1fr!important;gap:16px!important}
  .gallery{grid-template-columns:1fr!important;grid-auto-rows:auto!important}.g,.g:first-child,.g:nth-child(4){grid-column:auto!important;grid-row:auto!important;height:250px!important}
  .cal-shell{padding:12px!important;max-width:100%!important}.cal-top{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:12px!important}.cal-controls{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;width:100%!important}.cal-controls .btn{width:100%!important;padding:11px 8px!important}
  .week-wrap{display:none!important}.mobile-day{display:block!important;width:100%!important}.mday-head{gap:8px!important}.m-slot{width:100%!important;gap:10px!important;padding:13px 12px!important}.m-slot>*{min-width:0!important}
  .modal{padding:6px!important}.modal .box,.modal-box{width:calc(100vw - 12px)!important;max-width:none!important;max-height:92vh!important;overflow:auto!important;padding:16px 12px!important}.form{grid-template-columns:1fr!important}
  .mobilebar{left:6px!important;right:6px!important;bottom:6px!important;width:auto!important;grid-template-columns:1fr 1.2fr 1fr!important}.mobilebar a,.mobilebar button{min-width:0!important;padding:13px 3px!important;font-size:10px!important}
  .drawer{width:100%!important;max-width:100vw!important;padding:18px 12px!important}.actions-grid{grid-template-columns:1fr!important}
  .admin.show{grid-template-columns:1fr!important}.sidebar{height:auto!important;position:relative!important}.side-nav{grid-template-columns:1fr 1fr!important}.admin-main{padding:10px 8px 90px!important;width:100%!important;max-width:100vw!important;overflow:hidden!important}.admin-top{flex-direction:column!important;align-items:stretch!important;gap:10px!important}.stats{grid-template-columns:1fr 1fr!important}.admin-scroll{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}.admin-week{min-width:760px!important}
  .admin-login{padding:8px!important}.admin-login-card{width:calc(100vw - 16px)!important;max-width:none!important;padding:22px 14px!important}
}
@media(max-width:420px){.trust,.stats,.side-nav,.cal-controls{grid-template-columns:1fr!important}.g{height:220px!important}.m-slot{font-size:.92rem!important}}
</style>

</head>
<body>
<div class="shell">
  <div class="brand">FRIZER <span>ARSA</span></div>
  <div class="card">
    <div class="lock">🔒</div>
    <div class="kicker">Pristup vlasnika</div>
    <h1>ADMIN PRIJAVA</h1>
    <p class="muted">Unesi privatnu lozinku vlasnika da otvoriš kalendar i rezervacije klijenata.</p>
    <form id="loginForm">
      <div class="field"><label for="adminPassword">Admin lozinka</label><div class="pw-wrap"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Unesi admin lozinku" required><button type="button" class="eye" id="togglePw" aria-label="Show password">👁</button></div></div>
      <button class="btn" id="loginBtn" type="submit">Prijavi se</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="back" href="./">← Nazad na javni sajt</a>
  </div>
</div>
<script>
const form=document.getElementById('loginForm'),pw=document.getElementById('adminPassword'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
document.getElementById('togglePw').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};
const q=new URLSearchParams(location.search);if(q.get('error')==='session'){msg.className='msg err';msg.textContent='Admin sesija je istekla. Prijavi se ponovo.'}
form.addEventListener('submit',async e=>{e.preventDefault();const key=pw.value.trim();if(!key)return;btn.disabled=true;btn.textContent='Proveravam...';msg.className='msg';msg.textContent='';try{const r=await fetch('/api/bookings?admin=1',{method:'GET',headers:{'x-admin-key':key}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Pogrešna lozinka');sessionStorage.setItem('arsaAdminKey',key);msg.className='msg ok';msg.textContent='Prijava uspešna. Otvaram admin kalendar...';setTimeout(()=>location.href='admin.html',350)}catch(err){sessionStorage.removeItem('arsaAdminKey');msg.className='msg err';msg.textContent=err.message==='Invalid admin password'?'Pogrešna admin lozinka. Pokušaj ponovo.':(err.message||'Nije moguće povezivanje sa admin backendom.');btn.disabled=false;btn.textContent='Prijavi se'}});
</script>
</body>
</html>
