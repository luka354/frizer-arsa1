</head><body><div class="card"><div class="brand">FRIZER ARSA</div><h1>Otkaži termin</h1><p class="muted">Ovaj sigurni link je vezan za jednu rezervaciju. Klikni ispod samo ako želiš da oslobodiš termin.</p><button class="btn" id="cancelBtn">Otkaži moj termin</button><p id="result"></p><p><a href="./">Nazad na sajt</a></p></div><script>const token=new URLSearchParams(location.search).get('token');const btn=document.getElementById('cancelBtn'),res=document.getElementById('result');if(!token){btn.disabled=true;res.className='err';res.textContent='Link za otkazivanje nije potpun.'}btn.onclick=async()=>{if(!token)return;if(!confirm('Da li sigurno želiš da otkažeš ovaj termin?'))return;btn.disabled=true;btn.textContent='Otkazujem...';try{const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancelByToken',token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Nije moguće otkazati termin');res.className='ok';res.textContent=`Otkazano: ${d.booking.service}, ${d.booking.date} u ${d.booking.time}. Termin je ponovo slobodan.`;btn.style.display='none'}catch(e){res.className='err';res.textContent=e.message;btn.disabled=false;btn.textContent='Otkaži moj termin'}};</script></body></html>
